; QRun Lite: ESP32-2432S028R ("Cheap Yellow Display") pay-to-run kiosk.
;   pio run                 build
;   pio run -t upload       flash (needs include/secrets.h, see secrets.h.example)
;   pio test -e native      host tests of include/logic.h (no board needed)
[platformio]
default_envs = esp32dev

[env:esp32dev]
; Pinned: Arduino-ESP32 core 3.2.1 (pioarduino). The code uses core-3 APIs (ledcAttach); the registry's
; "espressif32" may resolve to an older Arduino core on a fresh machine or in CI.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board     = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
upload_speed = 460800

; TFT_eSPI setup for the CYD (ILI9341 320x240 + XPT2046 touch)
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=12
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    ; -D TFT_INVERSION_ON=1   ; uncomment if your board shows inverted colours (black looks white)
    -D SPI_FREQUENCY=65000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D SMOOTH_FONT=1

; Exact versions (what the release was tested with).
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    links2004/WebSockets @ 2.7.3
    bblanchon/ArduinoJson @ 7.4.3
    ricmoo/QRCode @ 0.0.1

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=gnu++17 -Wall -Wextra -Werror
